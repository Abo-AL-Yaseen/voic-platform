name: VOIC release verification
on:
  push:
    branches: [mahmoud]
  pull_request:
    branches: [mahmoud]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voic-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.23.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
      - name: Unit, type, build and dependency checks
        run: |
          pnpm --dir backend test
          pnpm --dir backend typecheck
          pnpm --dir backend build
          pnpm --dir frontend test
          pnpm --dir frontend typecheck
          pnpm --dir frontend build
          (cd frontend && node scripts/check-build.mjs)
          pnpm --dir backend audit --audit-level low
          pnpm --dir frontend audit --audit-level low
      - name: Native MySQL and Chrome (no containers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-server mysql-client
          sudo systemctl start mysql
          pnpm --dir frontend exec playwright install --with-deps chrome
      - name: Real isolated journeys, production gates, bounded load and restore
        working-directory: backend
        run: node scripts/ci-native-release.mjs
      # No dumps, captured mail, screenshots, QR material or runtime artifacts are uploaded.
