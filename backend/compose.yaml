name: voic-foundation
services:
  mysql:
    image: mysql:9.7.4
    command:
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in your local environment}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in your local environment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  mysql-data:
